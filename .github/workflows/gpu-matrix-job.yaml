on:
  workflow_call:
    inputs:
      build_type:
        description: "One of: [branch, nightly, pull-request]"
        required: true
        type: string
      date:
        description: "Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        type: string
      sha:
        description: "Full git commit SHA to check out"
        type: string
      matrix_filter:
        description: |
          jq expression which modifies the conda-cpp-build matrix.
          Each entry has default 'GPU' and 'DRIVER' fields that select the runner.
          For example, 'map(select(.ARCH == "amd64")) | map(.GPU = "rtxpro6000")' to test amd64 on RTX PRO 6000 GPUs.
        type: string
        default: "."
      container_image:
        description: "Container image URI. '{0}', '{1}', '{2}', and '{3}' are replaced by the matrix entry's CUDA_VER, PY_VER, ARCH, and LINUX_VER."
        required: true
        type: string
      script:
        description: "Shell code to be executed in a step, with the same placeholders as 'container_image'."
        required: true
        type: string
      file_to_upload:
        description: "Path to file(s) to be uploaded as a CI artifact."
        type: string
        default: "gh-status.json"
      artifact-name:
        description: "Identifier for the GitHub Actions artifact created by uploading 'file_to_upload', with the same placeholders as 'container_image'."
        type: string
        default: "result"

defaults:
  run:
    shell: bash

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: write
  issues: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  compute-matrix:
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      matrix_name: conda-cpp-build
      matrix_filter: 'map(. + {GPU: "l4", DRIVER: "latest"}) | ${{ inputs.matrix_filter }}'
  tests:
    name: ${{ matrix.CUDA_VER }}, ${{ matrix.PY_VER }}, ${{ matrix.ARCH }}, ${{ matrix.LINUX_VER }}, ${{ matrix.GPU }}, ${{ matrix.DRIVER }}-driver
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    runs-on: "linux-${{ matrix.ARCH }}-gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    container:
      image: ${{ format(inputs.container_image, matrix.CUDA_VER, matrix.PY_VER, matrix.ARCH, matrix.LINUX_VER) }} # zizmor: ignore[unpinned-images]
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        RAPIDS_BUILD_TYPE: ${{ inputs.build_type }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Telemetry setup
        uses: rapidsai/shared-actions/telemetry-dispatch-setup@main
        continue-on-error: true
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@eadc57871cde0c92a223d0f486ab669a2360f978 # main
        continue-on-error: true
        with:
          enable-apt: true
          enable-conda: true
          enable-pip: true
          enable-pypi-anaconda: true
      - name: Get PR Info
        if: startsWith(github.ref_name, 'pull-request/')
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Add PR Info
        if: startsWith(github.ref_name, 'pull-request/')
        run: | # zizmor: ignore[template-injection]
          echo "RAPIDS_BASE_BRANCH=${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}" >> "${GITHUB_ENV}"
      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@main
        with:
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@main
        env:
          AWS_REGION: "${{env.AWS_REGION}}"
          AWS_ACCESS_KEY_ID: "${{env.AWS_ACCESS_KEY_ID}}"
          AWS_SECRET_ACCESS_KEY: "${{env.AWS_SECRET_ACCESS_KEY}}"
        with:
          log-file: "${{ env.RAPIDS_ARTIFACTS_DIR }}/sccache.log"
          request-timeout: 7140
      - name: Check GitHub API rate limits
        run: |
          if ! type gh >/dev/null; then
              echo "'gh' CLI is not installed... skipping rate-limits check"
          else
              gh api /rate_limit | jq .
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run script
        run: |
          ulimit -n "$(ulimit -Hn)"
          $INPUTS_SCRIPT
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_SCRIPT: ${{ format(inputs.script, matrix.CUDA_VER, matrix.PY_VER, matrix.ARCH, matrix.LINUX_VER) }}
          # opt out of conda sharded repodata
          #
          # TODO: remove these when this is resolved: https://github.com/conda/infrastructure/issues/1286#issuecomment-4628580232
          CONDA_PLUGINS_USE_SHARDED_REPODATA: false
          MAMBA_USE_SHARDED_REPODATA: false
          RATTLER_SHARDED: false
      - name: Upload file to GitHub Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format(inputs.artifact-name, matrix.CUDA_VER, matrix.PY_VER, matrix.ARCH, matrix.LINUX_VER) }}
          path: ${{ inputs.file_to_upload }}
          if-no-files-found: ignore
      - name: Upload additional artifacts
        if: "!cancelled()"
        run: rapids-upload-artifacts-dir "custom-job-$(arch)"
      - name: Telemetry upload attributes
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-job-artifacts@main
        continue-on-error: true
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
